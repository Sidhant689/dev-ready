<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Main gradient: indigo → violet (brand colors) -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Inner glow for depth -->
    <radialGradient id="glow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <!-- Shimmer on top edge -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Radial glow overlay -->
  <rect width="64" height="64" rx="16" fill="url(#glow)"/>
  <!-- Top edge shimmer -->
  <rect width="64" height="32" rx="16" fill="url(#shine)"/>
  <rect y="16" width="64" height="16" fill="url(#shine)"/>

  <!--
    Icon: "Code-ready" mark
    Left bracket  <  +  bold checkmark  ✓  +  right bracket  >
    Reads as: your code is ready / you passed / interview-ready
  -->

  <!-- Left code bracket < -->
  <path
    d="M14 32 L22 23 M14 32 L22 41"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.55"
  />

  <!-- Right code bracket > -->
  <path
    d="M50 32 L42 23 M50 32 L42 41"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.55"
  />

  <!-- Bold center checkmark — the hero element -->
  <path
    d="M22 32 L28.5 39.5 L42 24"
    stroke="white"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
